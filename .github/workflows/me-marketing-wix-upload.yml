name: Fetch actual live ME Marketing frontend files

on:
  push:
    branches:
      - me-marketing-upload-temp

permissions:
  contents: write

jobs:
  fetch-live-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: me-marketing-upload-temp
          fetch-depth: 0
      - name: Download current production files
        shell: bash
        run: |
          set -euo pipefail
          base='https://bf9wic-me-marketi-cab8d612-bsmarket12.wix-site-host.com'
          mkdir -p sites/me-marketing-live/_astro
          curl --fail --silent --show-error "$base/contact.html" -o sites/me-marketing-live/contact.html
          curl --fail --silent --show-error "$base/index.html" -o sites/me-marketing-live/index.html
          curl --fail --silent --show-error "$base/_astro/ContactForm.Cy6qf6_z.js" -o sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js
          node --check sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js
          test "$(wc -c < sites/me-marketing-live/contact.html | tr -d ' ')" = '18889'
          test "$(wc -c < sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js | tr -d ' ')" = '4758'
      - name: Commit captured files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sites/me-marketing-live
          if ! git diff --cached --quiet; then
            git commit -m 'Capture actual live ME Marketing frontend [skip ci]'
            git push origin HEAD:me-marketing-upload-temp
          fi
