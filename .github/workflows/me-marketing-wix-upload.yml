name: Verify ME Marketing Thank You preview

on:
  push:
    branches:
      - me-marketing-upload-temp

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: 'https://jxbmmk-me-marketi-cab8d612-bsmarket12.wix-site-host.com'
    steps:
      - name: Verify preserved pages and new Thank You flow
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          curl --fail-with-body --silent --show-error "$BASE_URL/?v=$stamp" -o /tmp/home.html
          curl --fail-with-body --silent --show-error "$BASE_URL/contact.html?v=$stamp" -o /tmp/contact.html
          curl --fail-with-body --silent --show-error "$BASE_URL/_astro/ContactForm.Cy6qf6_z.js?v=$stamp" -o /tmp/contact-form.js
          curl --fail-with-body --silent --show-error "$BASE_URL/thank-you-page?v=$stamp" -o /tmp/thank-you.html
          curl --fail-with-body --silent --show-error "$BASE_URL/thank-you-page.html?v=$stamp" -o /tmp/thank-you-html.html
          grep -q 'Smart strategies' /tmp/home.html
          grep -q 'Bring us the' /tmp/contact.html
          grep -q 'window.location.assign("/thank-you-page")' /tmp/contact-form.js
          grep -q 'Thank You · ME Marketing' /tmp/thank-you.html
          grep -q 'Your request' /tmp/thank-you.html
          cmp /tmp/thank-you.html /tmp/thank-you-html.html
          echo 'Preview verified: existing site preserved, form redirects after success, and both Thank You routes return the branded page.'
