name: Verify patched ME Marketing deployment

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: 'https://dufnha-me-marketi-7c79f713-kafutravelae.wix-site-host.com'
    steps:
      - name: Wait for deployment readiness
        run: sleep 10
      - name: Verify worker routes
        shell: bash
        run: |
          set -euo pipefail
          stamp="$GITHUB_RUN_ID"
          curl --fail --silent --show-error "$BASE_URL/__me-proxy-health?verify=$stamp" --output /tmp/health.json
          grep -q '"version":"v8"' /tmp/health.json

          curl --fail --silent --show-error --dump-header /tmp/thank.headers "$BASE_URL/thank-you-page?verify=$stamp" --output /tmp/thank.html
          grep -qi '^x-me-marketing-route: thank-you-page-v8' /tmp/thank.headers
          grep -q 'Your request is in.' /tmp/thank.html
          grep -q 'Back to home' /tmp/thank.html

          curl --fail --silent --show-error --dump-header /tmp/script.headers "$BASE_URL/__me-thank-you-redirect.js?verify=$stamp" --output /tmp/redirect.js
          grep -qi '^x-me-marketing-route: redirect-script-v8' /tmp/script.headers
          grep -q "window.location.replace('/thank-you-page')" /tmp/redirect.js
      - name: Verify current website preservation and form hook
        shell: bash
        run: |
          set -euo pipefail
          stamp="$GITHUB_RUN_ID"
          curl --fail --silent --show-error --dump-header /tmp/contact.headers "$BASE_URL/contact.html?verify=$stamp" --output /tmp/contact.html
          grep -qi '^x-me-marketing-proxy: contact-v8' /tmp/contact.headers
          grep -q 'ME_THANK_YOU_REDIRECT_V8' /tmp/contact.html
          grep -qi 'Bring us the messy part\|Book a Strategy Call' /tmp/contact.html

          for path in / /audit.html /about.html /faq.html; do
            name=$(printf '%s' "$path" | tr '/.' '__')
            code=$(curl --silent --show-error --output "/tmp/${name}.html" --write-out '%{http_code}' "$BASE_URL$path?verify=$stamp")
            test "$code" = "200"
          done
          grep -qi 'Smart strategies\|ME Marketing' /tmp/_.html
      - name: Preview verified
        run: echo PREVIEW_VERIFIED_V8
