name: Diagnose ME Marketing production routing

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect domain and worker routes
        shell: bash
        run: |
          set -euo pipefail
          echo 'DNS'
          dig +short www.mesocialmediamarketing.com || true
          for item in \
            'live|https://www.mesocialmediamarketing.com' \
            'primary|https://me-marketi-7c79f713-kafutravelae.wix-site-host.com' \
            'new|https://ywjxjz-me-marketi-7c79f713-kafutravelae.wix-site-host.com' \
            'old|https://3zpa7h-me-marketi-7c79f713-kafutravelae.wix-site-host.com'; do
            label="${item%%|*}"
            base="${item#*|}"
            for path in /__me-proxy-health /thank-you-page /contact.html /; do
              safe=$(printf '%s' "$path" | tr '/.' '__')
              code=$(curl --silent --show-error --max-time 30 --max-redirs 0 --dump-header "/tmp/${label}-${safe}.headers" --output "/tmp/${label}-${safe}.body" --write-out '%{http_code}' "$base$path?diag=$GITHUB_RUN_ID" || true)
              echo "$label $path status=$code bytes=$(wc -c < "/tmp/${label}-${safe}.body" | tr -d ' ')"
              grep -Ei '^(location|x-me-marketing-route|x-me-marketing-proxy|server|x-wix|via):' "/tmp/${label}-${safe}.headers" || true
            done
          done
      - name: Test host-routed new worker
        shell: bash
        run: |
          set -euo pipefail
          base='https://ywjxjz-me-marketi-7c79f713-kafutravelae.wix-site-host.com'
          for host in www.mesocialmediamarketing.com mesocialmediamarketing.com; do
            code=$(curl --silent --show-error --max-time 30 --header "Host: $host" --output /tmp/host.body --write-out '%{http_code}' "$base/__me-proxy-health?diag=$GITHUB_RUN_ID" || true)
            echo "new worker Host=$host status=$code body=$(cat /tmp/host.body)"
          done
