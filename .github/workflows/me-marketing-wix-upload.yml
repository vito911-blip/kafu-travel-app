name: Verify ME Marketing Wix deployment

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: 'https://g9isku-me-marketi-7c79f713-kafutravelae.wix-site-host.com'
    steps:
      - name: Wait for deployment
        shell: bash
        run: sleep 10
      - name: Verify health route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$BASE_URL/__me-proxy-health?verify=$GITHUB_RUN_ID" --output /tmp/health.json
          grep -q '"version":"v6"' /tmp/health.json
      - name: Verify standalone Thank You page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header /tmp/thank.headers "$BASE_URL/thank-you-page?verify=$GITHUB_RUN_ID" --output /tmp/thank.html
          grep -qi '^x-me-marketing-route: thank-you-page-v6' /tmp/thank.headers
          grep -q 'Your request is in.' /tmp/thank.html
          grep -q 'Back to home' /tmp/thank.html
      - name: Verify success redirect script
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header /tmp/script.headers "$BASE_URL/__me-thank-you-redirect.js?verify=$GITHUB_RUN_ID" --output /tmp/redirect.js
          grep -qi '^x-me-marketing-route: redirect-script-v6' /tmp/script.headers
          grep -q "window.location.replace('/thank-you-page')" /tmp/redirect.js
      - name: Verify contact page injection and current site preservation
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --dump-header /tmp/contact.headers "$BASE_URL/contact.html?verify=$GITHUB_RUN_ID" --output /tmp/contact.html
          grep -qi '^x-me-marketing-proxy: contact-v6' /tmp/contact.headers
          grep -q 'ME_THANK_YOU_REDIRECT_V6' /tmp/contact.html
          grep -q 'Request received\|REQUEST RECEIVED\|messy part' /tmp/contact.html
          curl --fail --silent --show-error "$BASE_URL/?verify=$GITHUB_RUN_ID" --output /tmp/home.html
          grep -qi 'ME Marketing\|Smart strategies' /tmp/home.html
      - name: Verification complete
        run: echo PREVIEW_VERIFIED
