        uses: actions/checkout@v4
        with:
          ref: me-marketing-upload-temp
      - name: Verify exact assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js | tr -d ' ')" = '4781'
          test "$(md5sum sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js | awk '{print $1}')" = '14a786d0e26b1ed813b55957e246565a'
          test "$(wc -c < sites/me-marketing-live/thank-you-page | tr -d ' ')" = '6878'
          test "$(md5sum sites/me-marketing-live/thank-you-page | awk '{print $1}')" = '0773fcb7e09cd63aac5efca6a2fb9161'
          node --check sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js
      - name: Upload changed files to Wix deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X PUT -H 'Content-Type: text/javascript' --data-binary @sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js "$JS_URL"
          curl --fail-with-body --silent --show-error -X PUT -H 'Content-Type: text/html' --data-binary @sites/me-marketing-live/thank-you-page "$PAGE_URL"
          echo 'Wix deployment assets uploaded successfully.'
