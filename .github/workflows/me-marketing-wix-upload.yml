name: Package ME Marketing deploy files

on:
  push:
    branches:
      - me-marketing-upload-temp

permissions:
  contents: read

jobs:
  package-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: me-marketing-upload-temp
      - name: Verify deploy files
        shell: bash
        run: |
          set -euo pipefail
          node --check sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js
          test "$(wc -c < sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js | tr -d ' ')" = '4781'
          test "$(wc -c < sites/me-marketing-live/thank-you-page | tr -d ' ')" = '6878'
          grep -q 'window.location.assign("/thank-you-page")' sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js
          grep -q 'Your request' sites/me-marketing-live/thank-you-page
      - name: Upload deploy files
        uses: actions/upload-artifact@v4
        with:
          name: me-marketing-deploy-files
          path: |
            sites/me-marketing-live/_astro/ContactForm.Cy6qf6_z.js
            sites/me-marketing-live/thank-you-page
            sites/me-marketing-live/thank-you-page.html
            sites/me-marketing-live/deployment-manifest.json
          if-no-files-found: error
          retention-days: 1
