name: Inspect live ME Marketing v9 release

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_URL: 'https://www.mesocialmediamarketing.com'
    steps:
      - name: Wait for release propagation
        run: sleep 15
      - name: Confirm v9 worker is live
        shell: bash
        run: |
          set -euo pipefail
          stamp="$GITHUB_RUN_ID"
          curl --fail --silent --show-error --dump-header /tmp/health.headers "$LIVE_URL/__me-proxy-health?verify=$stamp" --output /tmp/health.json
          grep -q '"version":"v9"' /tmp/health.json

          curl --fail --silent --show-error --dump-header /tmp/contact.headers "$LIVE_URL/contact.html?verify=$stamp" --output /tmp/contact.html
          grep -qi '^x-me-marketing-proxy: contact-v9' /tmp/contact.headers
          grep -q 'ME_THANK_YOU_REDIRECT_V9' /tmp/contact.html
          grep -qi 'Book a Strategy Call\|messy part' /tmp/contact.html

          curl --fail --silent --show-error "$LIVE_URL/?verify=$stamp" --output /tmp/home.html
          grep -qi 'Smart strategies\|ME Marketing' /tmp/home.html
      - name: Inspect Thank You path before redirect cleanup
        shell: bash
        run: |
          set -euo pipefail
          stamp="$GITHUB_RUN_ID"
          code=$(curl --silent --show-error --max-redirs 0 --dump-header /tmp/thank.headers --output /tmp/thank.body --write-out '%{http_code}' "$LIVE_URL/thank-you-page?verify=$stamp" || true)
          echo "THANK_STATUS=$code"
          grep -Ei '^(location|x-me-marketing-route|content-type|server):' /tmp/thank.headers || true
          grep -q 'Your request is in.' /tmp/thank.body && echo THANK_BODY_OK || true
      - name: Live worker confirmed
        run: echo LIVE_WORKER_V9_CONFIRMED
