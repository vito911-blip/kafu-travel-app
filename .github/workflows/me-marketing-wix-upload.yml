name: Diagnose ME Marketing root route

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: 'https://g9isku-me-marketi-7c79f713-kafutravelae.wix-site-host.com'
      ORIGIN_URL: 'https://3zpa7h-me-marketi-7c79f713-kafutravelae.wix-site-host.com'
    steps:
      - name: Check origin and proxy paths
        shell: bash
        run: |
          set -euo pipefail
          for label_url in \
            "origin-root|$ORIGIN_URL/" \
            "origin-index|$ORIGIN_URL/index.html" \
            "proxy-root|$BASE_URL/" \
            "proxy-index|$BASE_URL/index.html" \
            "proxy-contact|$BASE_URL/contact.html" \
            "proxy-thank|$BASE_URL/thank-you-page"; do
            label="${label_url%%|*}"
            url="${label_url#*|}"
            code=$(curl --silent --show-error --output "/tmp/${label}.body" --write-out '%{http_code}' "$url?verify=$GITHUB_RUN_ID")
            size=$(wc -c < "/tmp/${label}.body" | tr -d ' ')
            echo "$label status=$code bytes=$size"
          done
          grep -qi 'ME Marketing\|Smart strategies' /tmp/proxy-index.body
          grep -q 'ME_THANK_YOU_REDIRECT_V6' /tmp/proxy-contact.body
          grep -q 'Your request is in.' /tmp/proxy-thank.body
