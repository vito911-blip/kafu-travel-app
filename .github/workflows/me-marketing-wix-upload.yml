name: Validate patched ME Marketing worker

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check sites/me-marketing/entry.mjs
          echo "BYTE_SIZE=$(wc -c < sites/me-marketing/entry.mjs | tr -d ' ')"
          echo "MD5=$(md5sum sites/me-marketing/entry.mjs | cut -d' ' -f1)"
          grep -q "headers.set('host','www.mesocialmediamarketing.com')" sites/me-marketing/entry.mjs
          grep -q 'ME_THANK_YOU_REDIRECT_V8' sites/me-marketing/entry.mjs
          echo PATCH_VALIDATED
