name: Upload ME Marketing v9 worker

on:
  push:
    branches:
      - me-marketing-upload-temp

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          node --check sites/me-marketing/entry.mjs
          test "$(wc -c < sites/me-marketing/entry.mjs | tr -d ' ')" = "8578"
          echo '4af9a74407e611b47ceefc80ebc88103  sites/me-marketing/entry.mjs' | md5sum --check --status
          grep -q 'ME_THANK_YOU_REDIRECT_V9' sites/me-marketing/entry.mjs
      - name: Upload to isolated Wix deployment
        shell: bash
        env:
          UPLOAD_URL_B64: ''
        run: |
          set -euo pipefail
          UPLOAD_URL="$(printf '%s' "$UPLOAD_URL_B64" | base64 --decode)"
          curl --fail --silent --show-error --request PUT \
            --header 'Content-Type: application/javascript' \
            --data-binary @sites/me-marketing/entry.mjs \
            "$UPLOAD_URL"
          echo UPLOAD_OK
